<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="description" content="BlendBar — เลือกเมนูน้ำปั่นสุขภาพ">
<title>BlendBar — เมนู</title>
<link rel="stylesheet" href="../../css/styles.css">
<style>
.menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-bottom: 8px; }
.menu-emoji-bg {
  width: 100%;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3.5rem;
  border-radius: var(--radius) var(--radius) 0 0;
}
.featured-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  align-items: center;
  gap: 0;
  margin-bottom: 16px;
  transition: all var(--transition);
  cursor: pointer;
}
.featured-card:hover { transform: translateX(4px); border-color: rgba(163,230,53,0.4); }
.featured-emoji {
  width: 90px;
  min-width: 90px;
  height: 90px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.8rem;
}
.featured-info { padding: 12px; flex: 1; }
.featured-name { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
.featured-desc { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 8px; line-height: 1.4; }
.featured-footer { display: flex; align-items: center; justify-content: space-between; }
.featured-price { font-size: 1.05rem; font-weight: 800; color: var(--primary); }

.add-btn-round {
  width: 34px; height: 34px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #0d0d1a;
  font-size: 1.2rem;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all var(--transition);
  font-weight: 700;
}
.add-btn-round:hover { transform: scale(1.15); }
.add-btn-round:active { transform: scale(0.95); }

.cart-floating {
  position: fixed;
  bottom: 20px; left: 16px; right: 16px;
  z-index: 90;
  display: none;
}
.cart-floating-inner {
  max-width: 480px;
  margin: 0 auto;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow-glow-primary), var(--shadow);
  cursor: pointer;
  transition: all var(--transition);
}
.cart-floating-inner:hover { transform: translateY(-2px); }
.cart-floating-left { display: flex; align-items: center; gap: 12px; }
.cart-count-badge {
  background: #0d0d1a;
  color: var(--primary);
  font-weight: 800;
  font-size: 0.85rem;
  padding: 4px 10px;
  border-radius: 20px;
}
.cart-floating-text { color: #0d0d1a; font-weight: 700; font-size: 1rem; }
.cart-floating-price { color: #0d0d1a; font-weight: 800; font-size: 1.1rem; }
</style>
</head>
<body>
<!-- Top Bar -->
<div class="topbar">
  <div class="topbar-inner">
    <a href="welcome.html" style="color:var(--text-muted);font-size:1.5rem;text-decoration:none;">←</a>
    <div>
      <span class="topbar-title">🥤 BlendBar</span>
      <span id="tableChip" style="margin-left:8px;font-size:0.75rem;color:var(--primary);background:rgba(163,230,53,0.1);padding:2px 10px;border-radius:20px;">T1</span>
    </div>
    <div style="position:relative;">
      <a href="cart.html" class="btn btn-icon btn-ghost" style="font-size:1.3rem;">🛒
        <span class="cart-count" style="position:absolute;top:-4px;right:-4px;background:var(--accent);color:white;font-size:0.6rem;font-weight:700;width:18px;height:18px;border-radius:50%;display:none;align-items:center;justify-content:center;"></span>
      </a>
    </div>
  </div>
</div>

<div class="container page-content">
  <!-- Search -->
  <div class="search-bar" style="margin-top:16px;">
    <span class="search-icon">🔍</span>
    <input type="text" class="input" id="searchInput" placeholder="ค้นหาเมนู..." autocomplete="off">
  </div>

  <!-- Category Tabs -->
  <div class="cat-tabs" id="catTabs" style="margin-bottom:20px;"></div>

  <!-- Featured Section -->
  <div id="featuredSection">
    <div class="section-title">⭐ เมนูแนะนำ</div>
    <div id="featuredList"></div>
  </div>

  <!-- All Menu Grid -->
  <div>
    <div class="section-title" id="menuTitle">🍹 ทั้งหมด</div>
    <div class="menu-grid" id="menuGrid"></div>
  </div>

  <div style="height:120px;"></div>
</div>

<!-- Floating Cart -->
<div class="cart-floating" id="cartFloating">
  <div class="cart-floating-inner" onclick="window.location.href='cart.html'">
    <div class="cart-floating-left">
      <span class="cart-count-badge" id="floatCount">0</span>
      <span class="cart-floating-text">ดูตะกร้า</span>
    </div>
    <span class="cart-floating-price" id="floatTotal">฿0</span>
  </div>
</div>

<script src="../../js/app.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const tableId = urlParams.get('table') || Store.getTable();
Store.setTable(tableId);
document.getElementById('tableChip').textContent = tableId;

// ─ Category Tabs ─
const catTabsEl = document.getElementById('catTabs');
let activeCategory = 'all';

CATEGORIES.forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'cat-tab' + (cat.id === 'all' ? ' active' : '');
  btn.innerHTML = `${cat.emoji} ${cat.label}`;
  btn.onclick = () => { activeCategory = cat.id; renderMenu(); updateCatTabs(); };
  catTabsEl.appendChild(btn);
});

function updateCatTabs() {
  catTabsEl.querySelectorAll('.cat-tab').forEach((btn, i) => {
    btn.classList.toggle('active', CATEGORIES[i].id === activeCategory);
  });
}

// ─ Featured ─
const featuredListEl = document.getElementById('featuredList');
const bestSellers = MENU_DATA.filter(m => m.tags.includes('bestseller')).slice(0, 3);
bestSellers.forEach((item, idx) => {
  const div = document.createElement('div');
  div.className = 'featured-card animate-fadeInUp';
  div.style.animationDelay = `${idx * 0.08}s`;
  div.style.background = Utils.getCategoryColor(item.category);
  div.innerHTML = `
    <div class="featured-emoji">${item.emoji}</div>
    <div class="featured-info">
      <div class="featured-name">${item.name}</div>
      <div class="featured-desc">${item.desc}</div>
      <div class="featured-footer">
        <span class="featured-price">${Utils.formatPrice(item.price)}</span>
        <button class="add-btn-round" onclick="event.stopPropagation();quickAdd(${item.id})">+</button>
      </div>
    </div>`;
  div.onclick = () => window.location.href = `customize.html?id=${item.id}&table=${tableId}`;
  featuredListEl.appendChild(div);
});

// ─ Menu Grid ─
const menuGridEl = document.getElementById('menuGrid');
const menuTitleEl = document.getElementById('menuTitle');

function renderMenu(query = '') {
  menuGridEl.innerHTML = '';
  const q = query.toLowerCase();
  let items = MENU_DATA.filter(m => {
    const matchCat = activeCategory === 'all' || m.category === activeCategory;
    const matchQ = !q || m.name.toLowerCase().includes(q) || m.desc.toLowerCase().includes(q);
    return matchCat && matchQ;
  });

  const catNames = { all: 'ทั้งหมด', fruit: 'Fruit Smoothie', yogurt: 'Yogurt', protein: 'Protein', coffee: 'Coffee', soda: 'Soda' };
  menuTitleEl.textContent = `🍹 ${catNames[activeCategory] || 'เมนู'}`;

  document.getElementById('featuredSection').style.display = (activeCategory === 'all' && !q) ? 'block' : 'none';

  if (items.length === 0) {
    menuGridEl.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:40px 0;">ไม่พบเมนูที่ค้นหา 😔</p>';
    return;
  }

  items.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'menu-card animate-fadeInUp';
    div.style.animationDelay = `${idx * 0.06}s`;
    const tagHtml = item.tags.length ? `<span class="menu-card-badge badge ${item.tags[0] === 'bestseller' ? 'badge-primary' : item.tags[0] === 'new' ? 'badge-accent' : 'badge-secondary'}">${item.tags[0] === 'bestseller' ? '🔥 ขายดี' : item.tags[0] === 'new' ? '✨ ใหม่' : '⭐ ยอดนิยม'}</span>` : '';
    div.innerHTML = `
      ${tagHtml}
      <div class="menu-emoji-bg" style="background:${Utils.getCategoryColor(item.category)}">${item.emoji}</div>
      <div class="menu-card-body">
        <div class="menu-card-name">${item.name}</div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:4px;">
          <span class="menu-card-price">${Utils.formatPrice(item.price)}</span>
          <button class="add-btn-round" style="width:30px;height:30px;font-size:1rem;" onclick="event.stopPropagation();quickAdd(${item.id})">+</button>
        </div>
      </div>`;
    div.onclick = () => window.location.href = `customize.html?id=${item.id}&table=${tableId}`;
    menuGridEl.appendChild(div);
  });
}

function quickAdd(id) {
  const item = Utils.getMenuById(id);
  if (!item) return;
  Store.addItem({
    cartId: `${id}-default-${Date.now()}`,
    menuId: id,
    name: item.name,
    emoji: item.emoji,
    price: item.price,
    qty: 1,
    sweetness: 75,
    ice: 'normal',
    size: 'M',
    milk: 'regular',
    toppings: [],
    extras: [],
  });
  Utils.showToast(`เพิ่ม ${item.name} แล้ว! 🎉`, '🥤');
  updateCartUI();
}

function updateCartUI() {
  const count = Store.getCount();
  const total = Store.getTotal();
  const floatEl = document.getElementById('cartFloating');
  document.getElementById('floatCount').textContent = count;
  document.getElementById('floatTotal').textContent = Utils.formatPrice(total);
  floatEl.style.display = count > 0 ? 'block' : 'none';
  document.querySelectorAll('.cart-count').forEach(el => {
    el.textContent = count;
    el.style.display = count > 0 ? 'flex' : 'none';
  });
}

document.getElementById('searchInput').addEventListener('input', e => renderMenu(e.target.value));
window.addEventListener('cartUpdate', updateCartUI);
renderMenu();
updateCartUI();
</script>
</body>
</html>
