<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="description" content="BlendBar — ร้านน้ำปั่นออร์แกนิค สั่งง่าย จ่ายไว ผ่าน QR Code">
<title>BlendBar — Welcome</title>
<link rel="stylesheet" href="../../css/styles.css">
<style>
  body { background: var(--bg); overflow-x: hidden; }
  .welcome-page { min-height: 100vh; display: flex; flex-direction: column; }

  .hero-section {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
    overflow: hidden;
    min-height: 100vh;
  }

  .hero-bg-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
  }
  .orb1 { width: 300px; height: 300px; background: rgba(163,230,53,0.12); top: -100px; left: -80px; }
  .orb2 { width: 250px; height: 250px; background: rgba(244,114,182,0.12); bottom: 0; right: -60px; }
  .orb3 { width: 200px; height: 200px; background: rgba(251,146,60,0.10); top: 40%; left: 50%; transform: translate(-50%,-50%); }

  .logo-wrap {
    position: relative;
    margin-bottom: 24px;
  }
  .logo-emoji {
    font-size: 5rem;
    display: block;
    filter: drop-shadow(0 0 30px rgba(163,230,53,0.5));
  }
  .logo-ring {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 2px solid rgba(163,230,53,0.3);
    animation: spin 8s linear infinite;
  }
  .logo-ring-2 {
    position: absolute;
    inset: -20px;
    border-radius: 50%;
    border: 1px dashed rgba(244,114,182,0.2);
    animation: spin 12s linear infinite reverse;
  }

  .brand-name {
    font-size: 2.8rem;
    font-weight: 900;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
    line-height: 1;
  }
  .brand-tagline {
    font-size: 1rem;
    color: var(--text-muted);
    margin-bottom: 28px;
  }

  .table-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 20px;
    background: rgba(163,230,53,0.1);
    border: 1px solid rgba(163,230,53,0.3);
    border-radius: 30px;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--primary);
    margin-bottom: 32px;
    animation: pulse 3s infinite;
  }

  /* Promo slider */
  .promo-slider {
    width: 100%;
    max-width: 380px;
    margin-bottom: 32px;
    overflow: hidden;
    border-radius: var(--radius);
  }
  .promo-slides { display: flex; transition: transform 0.5s ease; }
  .promo-slide {
    min-width: 100%;
    padding: 16px 20px;
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .promo-emoji { font-size: 2rem; }
  .promo-title { font-size: 1rem; font-weight: 700; color: #0d0d1a; }
  .promo-desc { font-size: 0.8rem; color: rgba(13,13,26,0.7); margin-top: 2px; }

  .promo-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 8px; margin-top: -8px; }
  .promo-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); transition: all 0.3s; }
  .promo-dot.active { background: var(--primary); width: 20px; border-radius: 3px; }

  .start-btn {
    width: 100%;
    max-width: 320px;
    padding: 20px;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
    border-radius: var(--radius-lg);
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .start-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
    pointer-events: none;
  }

  .quick-links {
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  .quick-link {
    padding: 10px 20px;
    border-radius: 30px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 0.85rem;
    font-weight: 500;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all var(--transition);
  }
  .quick-link:hover { color: var(--primary); border-color: var(--primary); }

  .stats-strip {
    display: flex;
    gap: 0;
    padding: 16px 0;
    width: 100%;
    max-width: 380px;
    border-top: 1px solid var(--border);
    margin-top: 16px;
    padding-top: 20px;
  }
  .stat-item { flex: 1; text-align: center; }
  .stat-item:not(:last-child) { border-right: 1px solid var(--border); }
  .stat-num { font-size: 1.3rem; font-weight: 800; color: var(--primary); }
  .stat-lbl { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }
</style>
</head>
<body>
<div class="welcome-page">
  <section class="hero-section">
    <div class="hero-bg-orb orb1"></div>
    <div class="hero-bg-orb orb2"></div>
    <div class="hero-bg-orb orb3"></div>

    <div class="logo-wrap animate-float" style="width:120px;height:120px;display:flex;align-items:center;justify-content:center;">
      <div class="logo-ring"></div>
      <div class="logo-ring-2"></div>
      <span class="logo-emoji">🥤</span>
    </div>

    <h1 class="brand-name gradient-text animate-fadeInUp">BlendBar</h1>
    <p class="brand-tagline animate-fadeInUp delay-100">ปั่นสด · สุขภาพดี · ส่งถึงโต๊ะคุณ</p>

    <div class="table-chip animate-fadeInUp delay-200">
      <span>📍</span>
      <span id="tableLabel">โต๊ะ T1</span>
    </div>

    <!-- Promo Banner -->
    <div class="promo-slider animate-fadeInUp delay-300">
      <div class="promo-slides" id="promoSlides"></div>
    </div>
    <div class="promo-dots" id="promoDots"></div>

    <a href="menu.html" id="startBtn" class="btn btn-primary start-btn animate-fadeInUp delay-400">
      🛒 เริ่มสั่งเลย!
    </a>

    <div class="quick-links animate-fadeInUp delay-500">
      <a href="#" class="quick-link">📋 ดูโปรโมชั่น</a>
      <a href="#" class="quick-link">⭐ รีวิวร้าน</a>
    </div>

    <div class="stats-strip animate-fadeInUp delay-500">
      <div class="stat-item">
        <div class="stat-num">20+</div>
        <div class="stat-lbl">เมนู</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">4.9⭐</div>
        <div class="stat-lbl">คะแนน</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">5 นาที</div>
        <div class="stat-lbl">รอรับ</div>
      </div>
    </div>
  </section>
</div>

<script src="../../js/app.js"></script>
<script>
  // Read table from URL: ?table=T1 or path /table/T1
  const urlParams = new URLSearchParams(window.location.search);
  const tableId = urlParams.get('table') || 'T1';
  Store.setTable(tableId);
  document.getElementById('tableLabel').textContent = `โต๊ะ ${tableId}`;

  // Update start btn link to pass table
  document.getElementById('startBtn').href = `menu.html?table=${tableId}`;

  // Promo slider
  const slidesEl = document.getElementById('promoSlides');
  const dotsEl = document.getElementById('promoDots');
  PROMO_BANNERS.forEach((b, i) => {
    const slide = document.createElement('div');
    slide.className = 'promo-slide';
    slide.style.background = b.bg;
    slide.innerHTML = `
      <span class="promo-emoji">${b.emoji}</span>
      <div>
        <div class="promo-title">${b.title}</div>
        <div class="promo-desc">${b.desc}</div>
      </div>`;
    slidesEl.appendChild(slide);

    const dot = document.createElement('div');
    dot.className = 'promo-dot' + (i === 0 ? ' active' : '');
    dotsEl.appendChild(dot);
  });

  let currentSlide = 0;
  function goToSlide(n) {
    currentSlide = (n + PROMO_BANNERS.length) % PROMO_BANNERS.length;
    slidesEl.style.transform = `translateX(-${currentSlide * 100}%)`;
    document.querySelectorAll('.promo-dot').forEach((d, i) => d.classList.toggle('active', i === currentSlide));
  }
  setInterval(() => goToSlide(currentSlide + 1), 3500);
</script>
</body>
</html>
