<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlendBar — ระบบร้านน้ำปั่น</title>
<link rel="stylesheet" href="css/styles.css">
<style>
body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
.landing {
  text-align:center; padding:40px 24px; max-width:480px; width:100%;
}
.hero-emoji { font-size:6rem; display:block; animation:float 3s ease-in-out infinite; margin-bottom:24px; }
h1 { font-size:2.5rem; font-weight:900; margin-bottom:8px; }
p { color:var(--text-muted); margin-bottom:32px; line-height:1.6; }
.btn-group { display:flex; flex-direction:column; gap:12px; }
.divider-text { color:var(--text-muted); font-size:0.85rem; margin:4px 0; }
.orb { position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none; }
.orb1 { width:400px;height:400px;background:rgba(163,230,53,0.1);top:-100px;left:-100px; }
.orb2 { width:300px;height:300px;background:rgba(244,114,182,0.1);bottom:-50px;right:-50px; }
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="landing animate-fadeInUp">
  <span class="hero-emoji">🥤</span>
  <h1 class="gradient-text">BlendBar</h1>
  <p>ระบบสั่งน้ำปั่นออนไลน์ผ่าน QR Code<br>สำหรับร้านน้ำปั่นสุขภาพ</p>
  <div class="btn-group">
    <a href="pages/customer/welcome.html?table=T1" class="btn btn-primary btn-lg">
      📱 ทดสอบหน้าลูกค้า (โต๊ะ T1)
    </a>
    <div class="divider-text">— หรือ —</div>
    <a href="pages/admin/dashboard.html" class="btn btn-secondary btn-lg">
      🖥 เข้าสู่ Admin Dashboard
    </a>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:4px;">
      <a href="pages/customer/menu.html?table=T3" class="btn btn-ghost btn-sm">🍹 เมนู T3</a>
      <a href="pages/admin/orders.html" class="btn btn-ghost btn-sm">📋 ออเดอร์</a>
      <a href="pages/qr-generator.html" class="btn btn-ghost btn-sm">🔲 QR Code</a>
    </div>
  </div>
  <p style="margin-top:28px;font-size:0.75rem;color:var(--text-muted);">สแกน QR Code ที่โต๊ะ → เลือกเมนู → ปรับสูตร → ชำระเงิน → รับสินค้า</p>
</div>
<script src="js/app.js"></script>
</body>
</html>
